# .planning/policy.yml
# Project policy read by backlog-management, task-workflow, git-conventions, code-review,
# and the sweep / triage / implementer routines. Skills never hardcode what is here.
#
# Every key below shows its DEFAULT. A repo copies this file and changes only what differs.
# A repo with no policy.yml behaves as if every default applies, with backend auto-detected.
# Keys marked REPO are the ones that almost always differ between projects.

backlog:
  backend: auto                     # auto | github-issues | markdown. REPO.
                                    # auto = github-issues if origin is github.com, gh is authed,
                                    # and issues are enabled; else markdown.
  render_file: BACKLOG.md           # generated view for github-issues backend; source of truth for markdown
  needs_discussion_expiry_days: 30  # triage cancels unanswered needs-discussion items after this
  max_open_backlog: 80              # sweep creates nothing above this, ranks existing items instead

ids:
  scheme: auto                      # auto | issue-number | numeric | prefixed
                                    # auto = issue-number for github-issues, numeric (001) for markdown
  prefixes: {}                      # prefixed only, e.g. {product: LMS, infra: INFRA, dev: DEV}. REPO.

statuses:
  flow: [backlog, ready, active, in-review, done]
  side: [blocked, cancelled]
  agent_selectable: [ready]         # implementer picks only these, and only with the agent-safe label

versioning:
  bump: release-commit-only         # release-commit-only | per-branch

git:
  commit_types: [feat, fix, chore, docs, refactor, test]
  branch_format: "<type>/<id>-<short-kebab>"
  protected_branches: [main]

review:
  independent_required: true        # task-workflow row 12; author never self-approves
  reviewer_receives: [diff, item, tests]   # never the author's plan or log

autonomous:
  enabled: false                    # REPO. false = implementer exits immediately on this repo
  max_parallel: 4
  max_per_run: 15
  max_diff_lines: 400
  max_files: 15
  task_wall_clock_min: 45
  run_wall_clock_min: 240
  ci_fix_retries: 2
  allowed_types: [fix, test, docs, refactor, chore, feat]
  require_human_review_if_touches:  # REPO. Glob paths. PR gets needs-human, agent never merges.
    - "**/migrations/**"
    - ".github/workflows/**"
    - "package.json"
    - "package-lock.json"
    - "pnpm-lock.yaml"
    - "pyproject.toml"
    - "Cargo.toml"
  forbidden:                        # regardless of any instruction, including from a human in a routine
    - force-push
    - edit-branch-protection
    - add-dependency-without-human-label
    - delete-tests
    - skip-tests
    - commit-to-protected-branch

checks:                             # commands the routines run; empty = skip that check. REPO.
  lint: ""                          # e.g. "npm run lint"
  typecheck: ""                     # e.g. "npm run typecheck"
  test: ""                          # e.g. "npm test"
  format: ""                        # e.g. "npm run format:check"
  quick_check_timeout_min: 10       # sweep skips a check that exceeds this

worktrees:
  up: ""                            # REPO. e.g. scripts/worktree-up.sh. Empty = max_parallel forced to 1
  down: ""                          # REPO. e.g. scripts/worktree-down.sh

tests:
  flaky_list: ""                    # e.g. tests/flaky.json. Retries allowed only for listed tests
  flaky_retries: 2

reporting:
  run_reports: run-lock-issue       # run-lock-issue (github) | planning-runs-dir (markdown)
  triage_digest: issue              # issue | file
  notify: []                        # e.g. [slack:#eng-agents]. Not wired by default
