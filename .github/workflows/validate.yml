name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  structure:
    name: Structural validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate plugin structure
        run: uv run --frozen pytest tests -q
