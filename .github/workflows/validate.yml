name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    # The shipped scripts run on contributors' machines, and BSD and GNU sed
    # disagree. A Linux-only matrix would not have caught that.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate plugin structure and scripts
        run: uv run --frozen pytest tests
